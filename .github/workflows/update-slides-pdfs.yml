name: Update lecture PDFs

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install decktape
        run: npm install -g decktape

      - name: Export slide decks
        run: python scripts/export_slides.py --output-dir slides

      - name: Commit updated PDFs
        run: |
          if git diff --quiet -- slides; then
            echo "No slide updates"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A slides
          git commit -m "Update lecture PDFs"
          git push
